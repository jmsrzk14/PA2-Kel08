# fly.toml app configuration file generated for pa02kel08-solitary-leaf-6142 on 2025-05-29T15:59:10+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pa02kel08-solitary-leaf-6142'
primary_region = 'sin'

[build]

[env]
  MYSQL_DATABASE = 'kawalptn'
  MYSQL_PASSWORD = 'kawal123'
  MYSQL_ROOT_PASSWORD = 'rootpassword'
  MYSQL_USER = 'kawal'

[[mounts]]
  source = 'mysql_data'
  destination = '/var/lib/mysql'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = ''
  internal_port = 0

  [[services.ports]]
    port = 8000
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'

  [[services.http_checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
