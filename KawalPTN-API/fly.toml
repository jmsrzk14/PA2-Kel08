app = "kawalptn-db"

[env]
  MYSQL_ROOT_PASSWORD = "rootpassword"
  MYSQL_DATABASE = "kawalptn"
  MYSQL_USER = "kawal"
  MYSQL_PASSWORD = "kawal123"

[mounts]
  source = "mysql_data"
  destination = "/var/lib/mysql"

[services]
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    port = 8000
    handlers = ["http"]

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "5s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

  [[services.http_checks]]
    interval = "10s"
    method = "get"
    path = "/health"
    timeout = "2s"
    grace_period = "5s"
